limit_req_zone $binary_remote_addr zone=agent_trade_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=agent_trade_quote:10m rate=2r/s;

upstream up-agent-trade-api {
    server 127.0.0.1:18788;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name agent-trade.xunlian.co;

    ssl_certificate /root/.acme.sh/xunlian.co/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/xunlian.co/xunlian.co.key;
    ssl_session_timeout 10m;
    ssl_session_cache shared:agent_trade_tls:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /home/ttp/agent-trade/market-maker-console/dist/client;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /api/public/v1/route-quotes {
        limit_req zone=agent_trade_quote burst=6 nodelay;
        include /usr/local/tengine-2.3.2/conf/conf.d/agent-trade-proxy.inc;
    }

    location /api/ {
        limit_req zone=agent_trade_api burst=30 nodelay;
        include /usr/local/tengine-2.3.2/conf/conf.d/agent-trade-proxy.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}

